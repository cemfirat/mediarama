              'postgres' => 'pdo_pgsql',
          ]);
          $db = Doctrine\DBAL\DriverManager::getConnection($dsn->parse((string) getenv('DATABASE_URL')));
          $checks = [
              'completed prefixed import' => (int) $db->fetchOne("SELECT COUNT(*) FROM import_runs WHERE source_type = 'coppermine' AND source_key = 'coppermine:fixture-prefix' AND status = 'completed'") === 1,
              'prefixed source mappings scoped' => (int) $db->fetchOne("SELECT COUNT(*) FROM import_mappings WHERE source_key = 'coppermine:fixture-prefix'") > 0,
