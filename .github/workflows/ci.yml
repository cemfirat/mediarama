      - name: Verify Coppermine migration preflight blockers
        run: |
          assert_inspect_blocked() {
            label="$1"
            expected="$2"
            output="/tmp/coppermine-preflight-${label}.txt"

            set +e
            php bin/console mediarama:import:coppermine:inspect >"$output" 2>&1
            status=$?
            set -e

            cat "$output"

            if [ "$status" -eq 0 ]; then
              echo "Expected preflight inspection to fail for: $label"
              exit 1
            fi

            grep -F "$expected" "$output"
          }

          assert_inspect_clean() {
            label="$1"
            output="/tmp/coppermine-preflight-${label}.txt"

            if ! php bin/console mediarama:import:coppermine:inspect >"$output" 2>&1; then
              cat "$output"
              echo "Expected preflight inspection to succeed for: $label"
              exit 1
            fi

            cat "$output"
