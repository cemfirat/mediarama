name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mediarama
          POSTGRES_USER: mediarama
          POSTGRES_PASSWORD: mediarama
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mediarama -d mediarama"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: coppermine
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      APP_ENV: test
      APP_DEBUG: 0
      APP_SECRET: mediarama-ci-only
      DATABASE_URL: postgresql://mediarama:mediarama@127.0.0.1:5432/mediarama?serverVersion=18&charset=utf8
      MESSENGER_TRANSPORT_DSN: doctrine://default?queue_name=async&auto_setup=false
      MEDIA_STORAGE_PATH: /tmp/mediarama-media
      EXIFTOOL_BINARY: exiftool
      FFPROBE_BINARY: ffprobe
      FFPROBE_PROCESS_TIMEOUT_SECONDS: 30
      FFPROBE_PROBE_SIZE_BYTES: 33554432
      FFPROBE_ANALYZE_DURATION_US: 5000000
      IMAGEMAGICK_BINARY: convert
      IMAGEMAGICK_IDENTIFY_BINARY: identify
      IMAGEMAGICK_LIMIT_MEMORY: 256MiB
      IMAGEMAGICK_LIMIT_MAP: 512MiB
      IMAGEMAGICK_LIMIT_DISK: 2GiB
      IMAGEMAGICK_LIMIT_AREA: 512MiB
      IMAGEMAGICK_LIMIT_WIDTH: 32768
      IMAGEMAGICK_LIMIT_HEIGHT: 32768
      IMAGEMAGICK_LIMIT_FILES: 128
      IMAGEMAGICK_LIMIT_THREADS: 2
      IMAGEMAGICK_LIMIT_TIME_SECONDS: 45
      IMAGEMAGICK_LIMIT_LIST_LENGTH: 32
      IMAGEMAGICK_PROCESS_TIMEOUT_SECONDS: 60
      UPLOAD_MAX_ASSET_BYTES: 2147483648
      UPLOAD_MAX_CHUNK_BYTES: 16777216
      COPPERMINE_DATABASE_URL: mysql://readonly:readonly@127.0.0.1:3306/coppermine
      COPPERMINE_SOURCE_ID: fixture-main
      COPPERMINE_TABLE_PREFIX: cpg_
      COPPERMINE_ALBUMS_ROOT: /tmp/coppermine-albums

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit Coppermine source provenance across Git history
        run: bash .github/scripts/audit-coppermine-provenance-history.sh

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_pgsql, pdo_mysql
          tools: composer:v2
          ini-values: variables_order=EGPCS

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y exiftool ffmpeg imagemagick mariadb-client

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify PHP exposes real environment variables
        run: |
          php -r '
          if (strpos((string) ini_get("variables_order"), "E") === false) {
              fwrite(STDERR, "PHP variables_order does not expose environment variables.\n");
              exit(1);
          }
          $url = $_ENV["DATABASE_URL"] ?? null;
          if (!is_string($url) || parse_url($url, PHP_URL_USER) !== "mediarama") {
              fwrite(STDERR, "CI DATABASE_URL is not visible through PHP environment variables.\n");
              exit(1);
          }
          echo "OK PHP environment precedence\n";
          '

      - name: Verify ImageMagick application resource envelope
        run: php tests/Integration/ImageMagick/resource-limits.php

      - name: Verify upload structural media validation
        run: php tests/Integration/Upload/structural-validation.php

      - name: Build UIkit frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s public/build/app.css
          test -s public/build/uikit.min.js
          test -s public/build/uikit-icons.min.js

      - name: Verify dependency install is reproducible
        run: |
          STATUS="$(git status --porcelain -- composer.lock symfony.lock package-lock.json package.json .env config)"
          if [ -n "$STATUS" ]; then
            echo "Dependency installation changed committed project state:"
            printf '%s\n' "$STATUS"
            exit 1
          fi

      - name: Lint PHP
        run: find src tests migrations -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate real-gallery evidence runner syntax
        run: bash -n bin/validate-coppermine-real

      - name: Validate YAML syntax without booting the application
        run: |
          php -r '
          require "vendor/autoload.php";
          foreach (glob("config/*.yaml") as $file) { Symfony\Component\Yaml\Yaml::parseFile($file, Symfony\Component\Yaml\Yaml::PARSE_CUSTOM_TAGS); echo "OK $file\n"; }
          foreach (glob("config/packages/*.yaml") as $file) { Symfony\Component\Yaml\Yaml::parseFile($file, Symfony\Component\Yaml\Yaml::PARSE_CUSTOM_TAGS); echo "OK $file\n"; }
          '

      - name: Validate Symfony container
        run: php bin/console lint:container

      - name: Verify Coppermine command surface
        run: |
          commands="$(php bin/console list --raw)"
          printf '%s\n' "$commands" | grep -E '^mediarama:import:coppermine[[:space:]]'
          printf '%s\n' "$commands" | grep -E '^mediarama:import:coppermine:inspect[[:space:]]'
          printf '%s\n' "$commands" | grep -E '^mediarama:import:coppermine:reconcile[[:space:]]'

          for removed in identity collections media keywords acl interactions; do
            if printf '%s\n' "$commands" | grep -q -E "^mediarama:import:coppermine:${removed}[[:space:]]"; then
              echo "Unexpected mutating stage command remains registered: $removed"
              exit 1
            fi
          done

      - name: Validate routes
        run: php bin/console debug:router --show-controllers

      - name: Run PostgreSQL migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

      - name: Show migration status
        run: php bin/console doctrine:migrations:status

      - name: Validate production security container
        run: APP_ENV=prod APP_DEBUG=0 php bin/console lint:container

      - name: Verify production authentication boundary
        run: tests/Integration/Security/http-authentication.sh

      - name: Run unit tests
        run: vendor/bin/phpunit

      - name: Verify concurrent upload finalization and crash recovery
        run: php tests/Integration/Upload/finalize-concurrency.php

      - name: Prepare Coppermine 1.6 fixture
        run: |
          mkdir -p /tmp/coppermine-albums/userpics
          convert -size 2x2 xc:white /tmp/coppermine-albums/userpics/sample.jpg
          convert -size 2x2 xc:white /tmp/coppermine-albums/userpics/sample2.jpg

          exiftool -overwrite_original \
            '-IFD0:Make=Fixture Camera Co' \
            '-IFD0:Model=FixtureCam 1' \
            '-ExifIFD:DateTimeOriginal=2024:01:02 10:30:00' \
            '-ExifIFD:LensModel=Fixture 35mm' \
            '-ExifIFD:ISO=400' \
            '-ExifIFD:FNumber=2.8' \
            '-ExifIFD:ExposureTime=0.008' \
            '-ExifIFD:FocalLength=35' \
            '-GPS:GPSLatitude=48.2082' \
            '-GPS:GPSLatitudeRef=N' \
            '-GPS:GPSLongitude=16.3738' \
            '-GPS:GPSLongitudeRef=E' \
            '-XMP-dc:Title=Embedded fixture title' \
            '-XMP-dc:Description=Embedded fixture description' \
            '-XMP-dc:Creator=Fixture Photographer' \
            '-XMP-dc:Rights=Fixture Copyright' \
            '-XMP-dc:Subject=portrait' \
            '-XMP-dc:Subject+=vienna' \
            '-XMP-iptcCore:Location=Vienna Fixture' \
            /tmp/coppermine-albums/userpics/sample.jpg

          exiftool -overwrite_original \
            '-IPTC:DateCreated=2024:03:05' \
            '-IPTC:ObjectName=IPTC embedded title' \
            '-IPTC:Caption-Abstract=IPTC embedded description' \
            '-IPTC:By-line=IPTC Creator' \
            '-IPTC:CopyrightNotice=IPTC Copyright' \
            '-IPTC:Sub-location=IPTC Vienna' \
            '-IPTC:Keywords=archive' \
            '-IPTC:Keywords+=vienna' \
            /tmp/coppermine-albums/userpics/sample2.jpg

          exiftool -json -struct -G1:4 -a -n -- /tmp/coppermine-albums/userpics/sample.jpg > /tmp/coppermine-rich-metadata.json
          php <<'PHP'
          <?php
          $decoded = json_decode((string) file_get_contents('/tmp/coppermine-rich-metadata.json'), true, flags: JSON_THROW_ON_ERROR);
          $raw = $decoded[0] ?? [];
          foreach ([
              'IFD0:Make',
              'IFD0:Model',
              'ExifIFD:DateTimeOriginal',
              'ExifIFD:ISO',
              'ExifIFD:LensModel',
              'XMP-dc:Title',
              'XMP-dc:Creator',
              'XMP-dc:Subject',
              'XMP-iptcCore:Location',
          ] as $key) {
              if (!array_key_exists($key, $raw)) {
                  fwrite(STDERR, 'Missing expected ExifTool family-1 key: '.$key.PHP_EOL);
                  exit(1);
              }
          }
          PHP

          ffmpeg -loglevel error -y \
            -f lavfi -i anullsrc=r=44100:cl=mono -t 0.25 -q:a 9 \
            /tmp/coppermine-albums/userpics/sample.mp3
          ffmpeg -loglevel error -y \
            -f lavfi -i color=c=black:s=16x16:r=10:d=0.25 -an -c:v mpeg4 -q:v 5 \
            /tmp/coppermine-albums/userpics/sample.mp4
          mariadb --host=127.0.0.1 --port=3306 --user=root --password=root coppermine \
            < tests/Fixtures/Coppermine/1.6-minimal.sql
          mariadb --host=127.0.0.1 --port=3306 --user=root --password=root \
            -e "CREATE USER IF NOT EXISTS 'readonly'@'%' IDENTIFIED BY 'readonly'; GRANT SELECT ON coppermine.* TO 'readonly'@'%'; FLUSH PRIVILEGES;"

      - name: Run end-to-end Coppermine migration
        run: php bin/console mediarama:import:coppermine

      - name: Process imported media asynchronously
        run: php bin/console messenger:consume async --limit=4 --time-limit=30 --no-interaction -vv

      - name: Verify migrated fixture
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';

          $dsn = new Doctrine\DBAL\Tools\DsnParser([
              'postgresql' => 'pdo_pgsql',
              'postgres' => 'pdo_pgsql',
          ]);
          $db = Doctrine\DBAL\DriverManager::getConnection($dsn->parse((string) getenv('DATABASE_URL')));
          $checks = [
              'main source audit key' => (int) $db->fetchOne("SELECT COUNT(*) FROM import_runs WHERE source_type = 'coppermine' AND source_key = 'coppermine:fixture-main' AND status = 'completed'") === 1,
              'main source mappings scoped' => (int) $db->fetchOne("SELECT COUNT(*) FROM import_mappings WHERE source_key = 'coppermine:fixture-main'") > 0,
              'ready media' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE processing_state = 'ready'") === 4,
              'ready audio media' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.mp3' AND mime_type = 'audio/mpeg' AND media_type = 'audio' AND processing_state = 'ready'") === 1,
              'ready video media' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.mp4' AND mime_type = 'video/mp4' AND media_type = 'video' AND processing_state = 'ready'") === 1,
              'media historical view count' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.jpg' AND view_count = 42") === 1,
              'second media historical view count' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample2.jpg' AND view_count = 9") === 1,
              'album historical view count' => (int) $db->fetchOne("SELECT COUNT(*) FROM collections WHERE title = 'Fixture Album' AND view_count = 17") === 1,
              'explicit album cover' => (int) $db->fetchOne("SELECT COUNT(*) FROM collections c JOIN media_assets m ON m.id = c.cover_media_id WHERE c.title = 'Fixture Album' AND m.original_filename = 'sample.jpg'") === 1,
              'explicit category cover' => (int) $db->fetchOne("SELECT COUNT(*) FROM collections c JOIN media_assets m ON m.id = c.cover_media_id WHERE c.title = 'Fixture Category' AND m.original_filename = 'sample2.jpg'") === 1,
              'dynamic album cover remains unpinned' => (int) $db->fetchOne("SELECT COUNT(*) FROM collections WHERE title = 'Linked Album' AND cover_media_id IS NULL") === 1,
              'Coppermine title and description beat embedded values' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.jpg' AND title = 'Fixture Photo' AND description = 'Imported fixture caption' AND metadata_provenance->>'title' = 'coppermine_import' AND metadata_provenance->>'description' = 'coppermine_import'") === 1,
              'embedded EXIF and XMP seed canonical metadata' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.jpg' AND creator = 'Fixture Photographer' AND copyright = 'Fixture Copyright' AND camera_make = 'Fixture Camera Co' AND camera_model = 'FixtureCam 1' AND lens = 'Fixture 35mm' AND iso = 400 AND location_name = 'Vienna Fixture' AND ABS(latitude - 48.2082) < 0.000001 AND ABS(longitude - 16.3738) < 0.000001 AND captured_at IS NOT NULL") === 1,
              'file metadata wins over stale Coppermine EXIF cache' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.jpg' AND camera_make = 'Fixture Camera Co' AND metadata->'exif'->>'IFD0:Make' = 'Fixture Camera Co'") === 1,
              'embedded metadata provenance' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.jpg' AND metadata_provenance->>'creator' = 'embedded' AND metadata_provenance->>'camera_make' = 'embedded' AND metadata_provenance->>'captured_at' = 'embedded' AND metadata_provenance->>'latitude' = 'embedded'") === 1,
              'qualified EXIF and XMP snapshot keys' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.jpg' AND jsonb_exists(metadata->'exif', 'IFD0:Make') AND jsonb_exists(metadata->'exif', 'ExifIFD:ISO') AND jsonb_exists(metadata->'xmp', 'XMP-dc:Title') AND jsonb_exists(metadata->'xmp', 'XMP-dc:Subject')") === 1,
              'embedded XMP keyword list preserved' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample.jpg' AND jsonb_array_length(metadata->'xmp'->'XMP-dc:Subject') = 2") === 1,
              'IPTC fallback seeds canonical metadata' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample2.jpg' AND title = 'Aggregate Only Photo' AND description = 'Rating aggregate without detailed vote rows' AND creator = 'IPTC Creator' AND copyright = 'IPTC Copyright' AND location_name = 'IPTC Vienna' AND captured_at::date = DATE '2024-03-05'") === 1,
              'qualified IPTC snapshot keys' => (int) $db->fetchOne("SELECT COUNT(*) FROM media_assets WHERE original_filename = 'sample2.jpg' AND jsonb_exists(metadata->'iptc', 'IPTC:ObjectName') AND jsonb_exists(metadata->'iptc', 'IPTC:Keywords') AND jsonb_array_length(metadata->'iptc'->'IPTC:Keywords') = 2") === 1,
              'nested category hierarchy' => (int) $db->fetchOne("SELECT COUNT(*) FROM collections child JOIN collections parent ON parent.id = child.parent_id WHERE child.title = 'Nested Category' AND parent.title = 'Fixture Category'") === 1,
              'nested album hierarchy' => (int) $db->fetchOne("SELECT COUNT(*) FROM collections album JOIN collections parent ON parent.id = album.parent_id WHERE album.title = 'Nested Album' AND parent.title = 'Nested Category'") === 1,
              'user gallery root ownership' => (int) $db->fetchOne("SELECT COUNT(*) FROM collections c JOIN users u ON u.id = c.owner_id WHERE c.title = 'User Gallery Album' AND c.parent_id IS NULL AND u.username = 'fixture-user'") === 1,
              'restricted password-reset collection' => (int) $db->fetchOne("SELECT COUNT(*) FROM collections WHERE title = 'Fixture Album' AND visibility = 'restricted' AND password_protected = TRUE AND password_reset_required = TRUE") === 1,
              'category creation ACL' => (int) $db->fetchOne("SELECT COUNT(*) FROM collection_access ca JOIN collections c ON c.id = ca.collection_id JOIN groups g ON g.id = ca.group_id WHERE c.title = 'Fixture Category' AND g.name = 'Registered' AND ca.capability = 'collection.create_child' AND ca.effect = 'allow'") === 1,
              'group restricted ACL' => (int) $db->fetchOne("SELECT COUNT(*) FROM collection_access ca JOIN collections c ON c.id = ca.collection_id JOIN groups g ON g.id = ca.group_id WHERE c.title = 'Fixture Album' AND g.name = 'Registered' AND ca.capability = 'collection.view' AND ca.effect = 'allow'") === 1,
              'album upload ACL' => (int) $db->fetchOne("SELECT COUNT(*) FROM collection_access ca JOIN collections c ON c.id = ca.collection_id JOIN groups g ON g.id = ca.group_id WHERE c.title = 'Fixture Album' AND g.name = 'Registered' AND ca.capability = 'collection.media.add' AND ca.effect = 'allow'") === 1,
              'album comment ACL' => (int) $db->fetchOne("SELECT COUNT(*) FROM collection_access ca JOIN collections c ON c.id = ca.collection_id JOIN groups g ON g.id = ca.group_id WHERE c.title = 'Fixture Album' AND g.name = 'Registered' AND ca.capability = 'media.comment' AND ca.effect = 'allow'") === 1,
              'album rating ACL' => (int) $db->fetchOne("SELECT COUNT(*) FROM collection_access ca JOIN collections c ON c.id = ca.collection_id JOIN groups g ON g.id = ca.group_id WHERE c.title = 'Fixture Album' AND g.name = 'Registered' AND ca.capability = 'media.rate' AND ca.effect = 'allow'") === 1,
              'disabled linked-album interaction ACLs absent' => (int) $db->fetchOne("SELECT COUNT(*) FROM collection_access ca JOIN collections c ON c.id = ca.collection_id WHERE c.title = 'Linked Album' AND ca.capability IN ('collection.media.add', 'media.comment', 'media.rate')") === 0,
              'user restricted ACL' => (int) $db->fetchOne("SELECT COUNT(*) FROM collection_access ca JOIN collections c ON c.id = ca.collection_id JOIN users u ON u.id = ca.user_id WHERE c.title = 'User Restricted Album' AND u.username = 'viewer-user' AND ca.capability = 'collection.view' AND ca.effect = 'allow'") === 1,
              'tags' => (int) $db->fetchOne('SELECT COUNT(*) FROM tags') === 2,
              'album-keyword membership' => (int) $db->fetchOne("SELECT COUNT(*) FROM collection_media cm JOIN collections c ON c.id = cm.collection_id JOIN media_assets m ON m.id = cm.media_id WHERE c.title = 'Linked Album' AND m.original_filename = 'sample.jpg'") === 1,
              'comment' => (int) $db->fetchOne("SELECT COUNT(*) FROM comments WHERE body = 'Fixture comment'") === 1,
              'guest comment' => (int) $db->fetchOne("SELECT COUNT(*) FROM comments WHERE body = 'Guest fixture comment' AND user_id IS NULL AND guest_name = 'Guest Alice' AND moderation_state = 'pending_review'") === 1,
              'favorite' => (int) $db->fetchOne('SELECT COUNT(*) FROM favorites') === 1,
              'rating' => (int) $db->fetchOne('SELECT COUNT(*) FROM ratings WHERE value = 4') === 1,
              'aggregate-only rating' => (int) $db->fetchOne("SELECT COUNT(*) FROM import_rating_aggregates a JOIN media_assets m ON m.id = a.media_id WHERE m.original_filename = 'sample2.jpg' AND a.average_5 = 3 AND a.vote_count = 2") === 1,
              'no synthesized individual rating' => (int) $db->fetchOne("SELECT COUNT(*) FROM ratings r JOIN media_assets m ON m.id = r.media_id WHERE m.original_filename = 'sample2.jpg'") === 0,
              'reset-required user' => (int) $db->fetchOne("SELECT COUNT(*) FROM users WHERE username = 'fixture-user' AND status = 'password_reset_required'") === 1,
              'english language id maps to locale' => (int) $db->fetchOne("SELECT COUNT(*) FROM users WHERE username = 'fixture-user' AND locale = 'en'") === 1,
              'german language id maps to locale' => (int) $db->fetchOne("SELECT COUNT(*) FROM users WHERE username = 'viewer-user' AND locale = 'de'") === 1,
              'empty async queue' => (int) $db->fetchOne("SELECT COUNT(*) FROM messenger_messages WHERE queue_name = 'async'") === 0,
          ];

          foreach ($checks as $name => $ok) {
              echo ($ok ? 'OK ' : 'FAIL ').$name.PHP_EOL;
              if (!$ok) {
                  exit(1);
              }
          }

          $uploadPermissions = new Mediarama\Collection\Infrastructure\Persistence\DbalCollectionUploadPermissionRepository($db);
          $viewerId = Symfony\Component\Uid\Uuid::fromString((string) $db->fetchOne("SELECT id FROM users WHERE username = 'viewer-user'"));
          $fixtureAlbumId = Symfony\Component\Uid\Uuid::fromString((string) $db->fetchOne("SELECT id FROM collections WHERE title = 'Fixture Album'"));
          $linkedAlbumId = Symfony\Component\Uid\Uuid::fromString((string) $db->fetchOne("SELECT id FROM collections WHERE title = 'Linked Album'"));

          if (!$uploadPermissions->userCanUpload($viewerId, $fixtureAlbumId)) {
              fwrite(STDERR, "FAIL runtime album upload permission should allow Registered viewer on Fixture Album".PHP_EOL);
              exit(1);
          }
          echo "OK runtime album upload permission allows source-enabled album".PHP_EOL;

          if ($uploadPermissions->userCanUpload($viewerId, $linkedAlbumId)) {
              fwrite(STDERR, "FAIL runtime album upload permission should deny Registered viewer on Linked Album".PHP_EOL);
              exit(1);
          }
          echo "OK runtime album upload permission denies source-disabled album".PHP_EOL;
          PHP

      - name: Verify public gallery visibility and derivative delivery
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';

          $dsn = new Doctrine\DBAL\Tools\DsnParser([
              'postgresql' => 'pdo_pgsql',
              'postgres' => 'pdo_pgsql',
          ]);
          $db = Doctrine\DBAL\DriverManager::getConnection($dsn->parse((string) getenv('DATABASE_URL')));

          $db->executeStatement(
              "UPDATE collections
               SET visibility = 'public',
                   password_protected = FALSE,
                   password_reset_required = FALSE
               WHERE title IN ('Fixture Category', 'Fixture Album')"
          );
          $db->executeStatement(
              "UPDATE media_assets
               SET moderation_state = 'published'
               WHERE title = 'Fixture Photo'"
          );

          file_put_contents('/tmp/public_category_id', (string) $db->fetchOne(
              "SELECT id FROM collections WHERE title = 'Fixture Category'"
          ));
          file_put_contents('/tmp/public_collection_id', (string) $db->fetchOne(
              "SELECT id FROM collections WHERE title = 'Fixture Album'"
          ));
          file_put_contents('/tmp/public_media_id', (string) $db->fetchOne(
              "SELECT id FROM media_assets WHERE title = 'Fixture Photo'"
          ));
          file_put_contents('/tmp/public_thumbnail_version', (string) $db->fetchOne(
              "SELECT MAX(processing_version)
               FROM media_derivatives
               WHERE media_id = (SELECT id FROM media_assets WHERE title = 'Fixture Photo')
                 AND kind = 'image'
                 AND profile = 'thumbnail'"
          ));

          $effective = (int) $db->fetchOne(
              "SELECT COUNT(*)
               FROM effective_public_collections
               WHERE collection_id IN (
                   SELECT id FROM collections WHERE title IN ('Fixture Category', 'Fixture Album')
               )"
          );
          if ($effective !== 2) {
              fwrite(STDERR, "Expected category and album in effective public view.\n");
              exit(1);
          }
          PHP

          php -S 127.0.0.1:8080 -t public public/index.php >/tmp/mediarama-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 1

          request_ok() {
            local url="$1"
            local output="$2"
            if ! curl --fail --silent --show-error "$url" -o "$output"; then
              echo "HTTP smoke request failed: $url"
              cat /tmp/mediarama-http.log || true
              exit 1
            fi
          }

          expect_status() {
            local expected="$1"
            local url="$2"
            local status
            status="$(curl --silent --output /tmp/http-body --write-out '%{http_code}' "$url")"
            if [ "$status" != "$expected" ]; then
              echo "Expected HTTP $expected but got $status for $url"
              cat /tmp/mediarama-http.log || true
              cat /tmp/http-body || true
              exit 1
            fi
          }

          expect_search_count() {
            local expected="$1"
            local url="$2"
            local output="$3"
            request_ok "$url" "$output"
            php -r '
              $decoded = json_decode((string) file_get_contents($argv[2]), true, flags: JSON_THROW_ON_ERROR);
              $actual = count($decoded["items"] ?? []);
              if ($actual !== (int) $argv[1]) {
                  fwrite(STDERR, "Expected ".$argv[1]." search items, got ".$actual.PHP_EOL);
                  exit(1);
              }
            ' "$expected" "$output"
          }

          CATEGORY_ID="$(cat /tmp/public_category_id)"
          COLLECTION_ID="$(cat /tmp/public_collection_id)"
          MEDIA_ID="$(cat /tmp/public_media_id)"
