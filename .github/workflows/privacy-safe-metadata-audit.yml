name: Privacy-safe metadata audit

on:
  pull_request:
    paths:
      - 'tests/Research/privacy-safe-inherited-metadata-audit.php'
      - 'docs/research/privacy-safe-inherited-metadata-audit.md'
      - 'docs/adr/0014-privacy-safe-inherited-metadata.md'
      - '.github/workflows/privacy-safe-metadata-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    name: Real-format inherited metadata research
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      EXIFTOOL_BINARY: exiftool
      IMAGEMAGICK_BINARY: convert
      IMAGEMAGICK_IDENTIFY_BINARY: identify

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: pdo_pgsql, pdo_mysql
          tools: composer:v2

      - name: Install runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y exiftool imagemagick libheif-examples libheif-plugin-aomdec libheif-plugin-aomenc libheif-plugin-libde265 libheif-plugin-x265 icc-profiles-free git cmake ninja-build pkg-config libaom-dev libx265-dev libpng-dev libjpeg-dev

      - name: Build pinned libheif fixture encoder
        run: |
          git clone --quiet https://github.com/strukturag/libheif.git /tmp/libheif-audit
          git -C /tmp/libheif-audit checkout --quiet --detach 413e2a87e6a70b3eccc3a3adc5801179dd2d9e00
          cmake -S /tmp/libheif-audit -B /tmp/libheif-audit-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBUILD_DOCUMENTATION=OFF \
            -DWITH_GDK_PIXBUF=OFF \
            -DWITH_EXAMPLE_HEIF_VIEW=OFF \
            -DWITH_EXAMPLE_HEIF_THUMB=OFF \
            -DENABLE_PLUGIN_LOADING=OFF \
            -DWITH_LIBDE265=OFF \
            -DWITH_X265=ON \
            -DWITH_AOM_DECODER=OFF \
            -DWITH_AOM_ENCODER=ON \
            -DWITH_DAV1D=OFF \
            -DWITH_SvtEnc=OFF \
            -DWITH_RAV1E=OFF \
            -DWITH_X264=OFF \
            -DWITH_OpenH264_DECODER=OFF \
            -DWITH_KVAZAAR=OFF
          cmake --build /tmp/libheif-audit-build --target heif-enc -j2
          test -x /tmp/libheif-audit-build/examples/heif-enc
          echo "HEIF_ENC_AUDIT_BINARY=/tmp/libheif-audit-build/examples/heif-enc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run non-gating real-format metadata audit
        run: php tests/Research/privacy-safe-inherited-metadata-audit.php
