security:
    expose_security_errors: none

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        mediarama_users:
            id: Mediarama\Security\Infrastructure\Authentication\DbalSecurityUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: mediarama_users
            user_checker: Mediarama\Security\Infrastructure\Authentication\ActiveUserChecker
            entry_point: Mediarama\Security\Infrastructure\Http\MediaramaAuthenticationEntryPoint
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: /logout
                target: home
                enable_csrf: true

when@prod:
    security:
        access_control:
            - { path: ^/login$, roles: PUBLIC_ACCESS }
            - { path: ^/api/auth/csrf$, roles: ROLE_USER }
            - { path: ^/api/uploads, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
