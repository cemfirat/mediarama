parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Mediarama\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/**/Domain/'
            - '../src/**/*Criteria.php'
            - '../src/**/*Result.php'
            - '../src/**/*Report.php'
            - '../src/Media/Application/ImageDerivativeProfile.php'
            - '../src/Media/Application/StoredObject.php'
            - '../src/Media/Application/InspectedMetadata.php'
            - '../src/Media/Application/DerivativeCleanupJob.php'
            - '../src/Media/Application/VideoProperties.php'
            - '../src/Media/Application/VideoPosterProfile.php'
            - '../src/Media/Application/VideoPlaybackProfile.php'
            - '../src/Collection/Application/SmartCollectionSqlPredicate.php'
            - '../src/Upload/Application/InspectedContent.php'
            - '../src/Export/Application/MetadataExportPolicy.php'
            - '../src/Security/Application/AuthenticatedUser.php'
            - '../src/Security/Infrastructure/Authentication/SecurityUser.php'
            - '../src/Organization/Application/ApprovedOrganizationAiPresentationGateway.php'
            - '../src/Organization/Application/OrganizationAiMediaInput.php'
            - '../src/Organization/Application/OrganizationAiPresentationAsset.php'
            - '../src/Organization/Application/OrganizationAiPreflightMedia.php'
            - '../src/Organization/Application/OrganizationAiRequest.php'
            - '../src/Organization/Application/OrganizationAiRequestSummary.php'

    Mediarama\Media\Infrastructure\Metadata\ExifToolProcess:
        arguments:
            $binary: '%env(EXIFTOOL_BINARY)%'

    Mediarama\Media\Infrastructure\Metadata\LocalExifToolInspector:
        arguments:
            $mediaRoot: '%env(resolve:MEDIA_STORAGE_PATH)%'

    Mediarama\Media\Application\MediaMetadataInspector:
        alias: Mediarama\Media\Infrastructure\Metadata\LocalExifToolInspector

    Mediarama\Export\Application\MetadataWriter:
        alias: Mediarama\Export\Infrastructure\ExifToolMetadataWriter

    Mediarama\Export\Application\MetadataSidecarWriter:
        alias: Mediarama\Export\Infrastructure\ExifToolXmpSidecarWriter

    Mediarama\Upload\Application\UploadSessionRepository:
        alias: Mediarama\Upload\Infrastructure\Persistence\DbalUploadSessionRepository

    Mediarama\Media\Application\MediaAssetRepository:
        alias: Mediarama\Media\Infrastructure\Persistence\DbalMediaAssetRepository

    Mediarama\Platform\Application\PlatformSettingsRepository:
        alias: Mediarama\Platform\Infrastructure\Persistence\DbalPlatformSettingsRepository

    Mediarama\Platform\Application\FirstRunSetup:
        alias: Mediarama\Platform\Infrastructure\Persistence\DbalFirstRunSetup

    Mediarama\Platform\Infrastructure\Security\BrowserSetupToken:
        arguments:
            $expectedToken: '%env(MEDIARAMA_SETUP_TOKEN)%'

    Mediarama\Platform\Application\SearchIndexPolicyRepository:
        alias: Mediarama\Platform\Infrastructure\Persistence\DbalSearchIndexPolicyRepository

    Mediarama\Publishing\Application\PublicPublicationTimelineStore:
        alias: Mediarama\Publishing\Infrastructure\Persistence\DbalPublicPublicationTimelineStore

    Mediarama\Seo\Application\PublicSitemapQuery:
        alias: Mediarama\Seo\Infrastructure\Persistence\DbalPublicSitemapQuery

    Mediarama\Seo\Infrastructure\Http\PublicUrlGenerator:
        arguments:
            $baseUrl: '%env(PUBLIC_BASE_URL)%'

    Mediarama\Media\Infrastructure\Storage\LocalMediaStorage:
        arguments:
            $mediaRoot: '%env(resolve:MEDIA_STORAGE_PATH)%'

    Mediarama\Media\Application\MediaStorage:
        alias: Mediarama\Media\Infrastructure\Storage\LocalMediaStorage

    Mediarama\Upload\Application\ContentInspector:
        alias: Mediarama\Upload\Infrastructure\LocalContentInspector

    Mediarama\Media\Application\ValidateStoredMediaStructure:
        alias: Mediarama\Media\Infrastructure\Probe\LocalStoredMediaStructureValidator

    Mediarama\Media\Application\InspectVideoProperties:
        alias: Mediarama\Media\Infrastructure\Probe\FfprobeVideoInspector

    Mediarama\Media\Infrastructure\Probe\FfprobeProcess:
        arguments:
            $binary: '%env(FFPROBE_BINARY)%'
            $timeoutSeconds: '%env(float:FFPROBE_PROCESS_TIMEOUT_SECONDS)%'
            $probeSizeBytes: '%env(int:FFPROBE_PROBE_SIZE_BYTES)%'
            $analyzeDurationMicroseconds: '%env(int:FFPROBE_ANALYZE_DURATION_US)%'

    Mediarama\Media\Infrastructure\Video\FfmpegProcess:
        arguments:
            $binary: '%env(FFMPEG_BINARY)%'
            $timeoutSeconds: '%env(float:FFMPEG_PROCESS_TIMEOUT_SECONDS)%'

    Mediarama\Collection\Application\CollectionAccessPolicy:
        alias: Mediarama\Collection\Infrastructure\Persistence\DbalCollectionAccessPolicy

    Mediarama\Collection\Application\SmartCollectionConfigurator:
        alias: Mediarama\Collection\Infrastructure\Persistence\DbalSmartCollectionConfigurator

    Mediarama\Collection\Application\SmartCollectionResolver:
        alias: Mediarama\Collection\Infrastructure\Persistence\DbalSmartCollectionResolver

    Mediarama\Collection\Application\SmartCollectionManagement:
        alias: Mediarama\Collection\Infrastructure\Persistence\DbalSmartCollectionManagement

    Mediarama\Collection\Application\SmartCollectionPublication:
        alias: Mediarama\Collection\Infrastructure\Persistence\DbalSmartCollectionPublication

    Mediarama\Upload\Application\UploadDestinationAuthorizer:
        alias: Mediarama\Upload\Infrastructure\Authorization\CollectionUploadDestinationAuthorizer

    Mediarama\Upload\Application\UploadQuota:
        alias: Mediarama\Upload\Infrastructure\Persistence\DbalUploadQuota

    Mediarama\Upload\Infrastructure\Persistence\DbalUploadQuota:
        arguments:
            $defaultQuotaBytes: '%env(int:UPLOAD_DEFAULT_QUOTA_BYTES)%'

    Mediarama\Upload\Application\ChunkStorage:
        alias: Mediarama\Upload\Infrastructure\Storage\LocalChunkStorage

    Mediarama\Upload\Infrastructure\Storage\LocalChunkStorage:
        arguments:
            $mediaRoot: '%env(resolve:MEDIA_STORAGE_PATH)%'

    Mediarama\Upload\Application\UploadPolicy:
        arguments:
            $maximumAssetBytes: '%env(int:UPLOAD_MAX_ASSET_BYTES)%'
            $maximumChunkBytes: '%env(int:UPLOAD_MAX_CHUNK_BYTES)%'

    Mediarama\Upload\Application\UploadFinalizationRepository:
        alias: Mediarama\Upload\Infrastructure\Persistence\DbalUploadFinalizationRepository

    Mediarama\Upload\Application\UploadFinalizationCriticalSection:
        alias: Mediarama\Upload\Infrastructure\Persistence\DbalUploadFinalizationCriticalSection

    Mediarama\Upload\Application\UploadContentPolicy:
        arguments:
            $allowedMimeTypes:
                - 'image/jpeg'
                - 'image/png'
                - 'image/gif'
                - 'image/webp'
                - 'image/tiff'
                - 'image/avif'
                - 'image/heic'
                - 'image/heif'
                - 'video/mp4'
                - 'video/quicktime'
                - 'video/webm'
                - 'audio/mpeg'
                - 'audio/mp4'
                - 'audio/ogg'
                - 'audio/flac'

    Mediarama\Upload\Application\ExpiredUploadSessionRepository:
        alias: Mediarama\Upload\Infrastructure\Persistence\DbalExpiredUploadSessionRepository

    Mediarama\Media\Application\MediaDerivativeRepository:
        alias: Mediarama\Media\Infrastructure\Persistence\DbalMediaDerivativeRepository

    Mediarama\Media\Application\DerivativeCleanupRepository:
        alias: Mediarama\Media\Infrastructure\Persistence\DbalDerivativeCleanupRepository

    Mediarama\Media\Application\CleanupSupersededDerivatives:
        arguments:
            $graceDays: '%env(int:DERIVATIVE_RETENTION_GRACE_DAYS)%'
            $keepNewestVersions: '%env(int:DERIVATIVE_RETENTION_KEEP_GENERATIONS)%'

    Mediarama\Media\Application\MediaDerivativeRegenerationLock:
        alias: Mediarama\Media\Infrastructure\Persistence\PostgresMediaDerivativeRegenerationLock

    Mediarama\Media\Application\ImageDerivativeGenerator:
        alias: Mediarama\Media\Infrastructure\Image\ImageMagickDerivativeGenerator

    Mediarama\Media\Application\VideoPosterGenerator:
        alias: Mediarama\Media\Infrastructure\Video\FfmpegVideoDerivativeGenerator

    Mediarama\Media\Application\VideoPlaybackGenerator:
        alias: Mediarama\Media\Infrastructure\Video\FfmpegVideoDerivativeGenerator

    Mediarama\Media\Infrastructure\Image\ImageMagickResourceLimits:
        arguments:
            $memory: '%env(IMAGEMAGICK_LIMIT_MEMORY)%'
            $map: '%env(IMAGEMAGICK_LIMIT_MAP)%'
            $disk: '%env(IMAGEMAGICK_LIMIT_DISK)%'
            $area: '%env(IMAGEMAGICK_LIMIT_AREA)%'
            $width: '%env(int:IMAGEMAGICK_LIMIT_WIDTH)%'
            $height: '%env(int:IMAGEMAGICK_LIMIT_HEIGHT)%'
            $files: '%env(int:IMAGEMAGICK_LIMIT_FILES)%'
            $threads: '%env(int:IMAGEMAGICK_LIMIT_THREADS)%'
            $timeSeconds: '%env(int:IMAGEMAGICK_LIMIT_TIME_SECONDS)%'
            $listLength: '%env(int:IMAGEMAGICK_LIMIT_LIST_LENGTH)%'

    Mediarama\Media\Infrastructure\Image\ImageMagickProcess:
        arguments:
            $binary: '%env(IMAGEMAGICK_BINARY)%'
            $identifyBinary: '%env(IMAGEMAGICK_IDENTIFY_BINARY)%'
            $timeoutSeconds: '%env(float:IMAGEMAGICK_PROCESS_TIMEOUT_SECONDS)%'

    Mediarama\Media\Infrastructure\Image\CwebpEncoder:
        arguments:
            $binary: '%env(CWEBP_BINARY)%'
            $timeoutSeconds: '%env(float:CWEBP_PROCESS_TIMEOUT_SECONDS)%'

    Mediarama\Media\Infrastructure\Image\ImageWatermarkConfiguration:
        arguments:
            $assetPath: '%env(IMAGE_WATERMARK_ASSET_PATH)%'
            $sizePercent: '%env(int:IMAGE_WATERMARK_SIZE_PERCENT)%'
            $opacityPercent: '%env(int:IMAGE_WATERMARK_OPACITY_PERCENT)%'
            $marginPercent: '%env(int:IMAGE_WATERMARK_MARGIN_PERCENT)%'
            $gravity: '%env(IMAGE_WATERMARK_GRAVITY)%'

    Mediarama\Media\Application\InspectImageFileGeometry:
        alias: Mediarama\Media\Infrastructure\Image\ImageMagickFileGeometryInspector

    Mediarama\Media\Application\InspectImageGeometry:
        alias: Mediarama\Media\Infrastructure\Image\ImageMagickGeometryInspector

    mediarama.media.profile.thumbnail:
        class: Mediarama\Media\Application\ImageDerivativeProfile
        arguments: ['thumbnail', 480, 480, 'webp', 82, '%env(bool:IMAGE_WATERMARK_THUMBNAIL)%']

    mediarama.media.profile.preview:
        class: Mediarama\Media\Application\ImageDerivativeProfile
        arguments: ['preview', 1600, 1600, 'webp', 84, '%env(bool:IMAGE_WATERMARK_PREVIEW)%']

    mediarama.media.profile.large:
        class: Mediarama\Media\Application\ImageDerivativeProfile
        arguments: ['large', 2560, 2560, 'webp', 86, '%env(bool:IMAGE_WATERMARK_LARGE)%']

    Mediarama\Media\Application\GenerateImageDerivatives:
        arguments:
            $processingVersion: 2
            $profiles:
                - '@mediarama.media.profile.thumbnail'
                - '@mediarama.media.profile.preview'
                - '@mediarama.media.profile.large'


    mediarama.media.video.poster_profile:
        class: Mediarama\Media\Application\VideoPosterProfile
        arguments:
            - 'poster'
            - '%env(int:VIDEO_POSTER_MAX_WIDTH)%'
            - '%env(int:VIDEO_POSTER_MAX_HEIGHT)%'
            - 3

    mediarama.media.video.playback_profile:
        class: Mediarama\Media\Application\VideoPlaybackProfile
        arguments:
            - 'browser_mp4'
            - '%env(int:VIDEO_PLAYBACK_MAX_WIDTH)%'
            - '%env(int:VIDEO_PLAYBACK_MAX_HEIGHT)%'
            - '%env(VIDEO_PLAYBACK_VIDEO_CODEC)%'
            - '%env(int:VIDEO_PLAYBACK_CRF)%'
            - '%env(VIDEO_PLAYBACK_PRESET)%'
            - '%env(VIDEO_PLAYBACK_AUDIO_CODEC)%'
            - '%env(VIDEO_PLAYBACK_AUDIO_BITRATE)%'

    Mediarama\Media\Application\GenerateVideoDerivatives:
        arguments:
            $posterProfile: '@mediarama.media.video.poster_profile'
            $playbackProfile: '@mediarama.media.video.playback_profile'
            $processingVersion: 1


    Mediarama\Media\Application\LibraryMediaSearch:
        alias: Mediarama\Media\Infrastructure\Persistence\DbalLibraryMediaSearch

    Mediarama\Media\Application\PublicMediaSearch:
        alias: Mediarama\Media\Infrastructure\Persistence\DbalPublicMediaSearch


    Mediarama\Security\Application\CurrentUser:
        alias: Mediarama\Security\Infrastructure\Http\RequestCurrentUser

    Mediarama\Security\Application\SystemAdministrationPolicy:
        alias: Mediarama\Security\Infrastructure\Authorization\DbalSystemAdministrationPolicy

    Mediarama\Security\Infrastructure\Http\RequestCurrentUser:
        arguments:
            $appEnvironment: '%kernel.environment%'

    Mediarama\Security\Infrastructure\Http\DevelopmentActorSubscriber:
        arguments:
            $appEnvironment: '%kernel.environment%'


    Mediarama\Import\Application\ImportMappingRepository:
        alias: Mediarama\Import\Infrastructure\Persistence\DbalImportMappingRepository

    Mediarama\Import\Application\ImportCheckpointRepository:
        alias: Mediarama\Import\Infrastructure\Persistence\DbalImportCheckpointRepository


    Mediarama\Import\Coppermine\CoppermineConnectionFactory:
        arguments:
            $databaseUrl: '%env(COPPERMINE_DATABASE_URL)%'

    Mediarama\Import\Coppermine\CoppermineTablePrefix:
        arguments:
            $value: '%env(COPPERMINE_TABLE_PREFIX)%'


    Mediarama\Import\Coppermine\CoppermineFileLocator:
        arguments:
            $albumsRoot: '%env(COPPERMINE_ALBUMS_ROOT)%'


    Mediarama\Collection\Application\PublicSmartCollectionResolver:
        alias: Mediarama\Collection\Infrastructure\Persistence\DbalPublicSmartCollectionResolver

    Mediarama\Collection\Application\PublicGalleryQuery:
        alias: Mediarama\Collection\Infrastructure\Persistence\DbalPublicGalleryQuery

    Mediarama\Organization\Application\OrganizationProposalStore:
        alias: Mediarama\Organization\Infrastructure\Persistence\DbalOrganizationProposalStore

    Mediarama\Organization\Application\OrganizationProposalReview:
        alias: Mediarama\Organization\Infrastructure\Persistence\DbalOrganizationProposalReview

    Mediarama\Organization\Application\OrganizationMetadataSnapshotQuery:
        alias: Mediarama\Organization\Infrastructure\Persistence\DbalOrganizationMetadataSnapshotQuery

    Mediarama\Organization\Application\OrganizationAiPreflightStore:
        alias: Mediarama\Organization\Infrastructure\Persistence\DbalOrganizationAiPreflightStore

    Mediarama\Organization\Application\OrganizationAiPresentationAssetReader:
        alias: Mediarama\Organization\Infrastructure\Persistence\DbalOrganizationAiPresentationAssetReader

    Mediarama\Organization\Application\OrganizationAiProviderRegistry:
        arguments:
            $providers: !tagged_iterator mediarama.organization_ai_provider
